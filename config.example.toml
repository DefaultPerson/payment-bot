[bot]
supported_languages = ["ru", "ua", "en"]
fallback_language = "ru"
# username is auto-derived from Telegram (getMe) at startup; this is the fallback.
# Set username_override to force a specific @username and skip getMe.
username = "HydraPaymentBot"
support_username = "HMonitorsBot"

[service_channel]
chat_id = -1001234567890
thread_id = 0

[http]
host = "127.0.0.1"
port = 8080
bot_cache_seconds = 30

[logging]
file_path = "logs/payment-bot.log"
max_bytes = 5242880
backup_count = 5

[payments]
# Master test switch: routes CryptoBot + xRocket to their TEST networks.
# On -> uses CRYPTOBOT_TESTNET_TOKEN / XROCKET_TESTNET_TOKEN (.env) and testnet hosts.
# Telegram Stars has no test network and is unaffected. Keep false for production.
test_mode = false

[cryptobot]
enabled = true
api_url = "https://pay.crypt.bot"
accepted_assets = ["USDT", "TON", "BTC"]
fee_percent = 3
invoice_expires_seconds = 3600
poll_interval_seconds = 30
poll_batch_size = 50

[xrocket]
enabled = false
testnet = false
# The SDK's built-in testnet host (pay.testnet.xrocket.tg) is dead; when payments.test_mode
# is on, base_url is overridden with this working testnet endpoint.
testnet_base_url = "https://pay.testnet.xrocket.exchange"
currency = "USDT"
fee_percent = 0
invoice_expires_seconds = 3600
poll_interval_seconds = 30
poll_batch_size = 50

# Loyalty: percentage discounts off the (duration-discounted) base, by months of tenure.
# *_active_months = the month of tenure the tier starts from (month 1 = first 30 active
# days = basic, no discount). Defaults: bronze 5% from month 2, silver 10% from month 4,
# gold 15% from month 6.
[loyalty]
bronze_active_months = 2
bronze_discount_percent = 5
silver_active_months = 4
silver_discount_percent = 10
gold_active_months = 6
gold_discount_percent = 15

[promos]
max_discount_percent = 50

[stars]
enabled = true
app_store_fee_percent = 30
star_usd_rate = 0.013
invoice_expires_seconds = 3600

[referral]
percent_default = 10
min_withdraw_usd = 10
allow_referrer_change = false

[notifications]
loop_interval_seconds = 3600
batch_size = 100
reminder_days_before = 3
reminder_window_seconds = 3600
post_expired_delay_hours = 24

[observability]
invoice_cleanup_interval_seconds = 300
metrics_snapshot_interval_seconds = 60

# Tariff plans (products). Each plan groups its duration variants below (matched by
# plan_code) and declares which chats it unlocks. chat_ids = [] means the plan opens
# every chat listed in [access].protected_chats (the current single-plan behaviour);
# listing ids restricts the plan to that subset.
[[tariffs.plans]]
code = "main"
title = "Hydra Monitors"
description = ""
chat_ids = []
active = true

# Duration variants. base_price_usd is the pre-discount total for the whole duration;
# duration_discount_percent is applied on top. Net access price (status=basic):
#   1m = $59.00, 3m = $168.15 (-5%), 6m = $318.60 (-10%).
[[tariffs.items]]
code = "1m"
plan_code = "main"
duration_months = 1
base_price_usd = 59
duration_discount_percent = 0
active = true

[[tariffs.items]]
code = "3m"
plan_code = "main"
duration_months = 3
base_price_usd = 177
duration_discount_percent = 5
active = true

[[tariffs.items]]
code = "6m"
plan_code = "main"
duration_months = 6
base_price_usd = 354
duration_discount_percent = 10
active = true

[access]
invite_link_ttl_seconds = 86400
revoke_ban_seconds = 60
protected_chats = []
