# Production deployment for Coolify (Build Pack: Docker Compose).
#
# Postgres and Redis are EXTERNAL and intentionally NOT defined here:
#   - Postgres: external Postgres over a private network
#               -> HOST:5432, one database per service.
#   - Redis:    the app server's local redis (HOST:6379),
#               one db-index per service.
#
# The container reaches those private IPs via the host's private-network routing
# (normal bridge networking on the server — no host networking needed here).
#
# Provide every value below as a Coolify Environment Variable (mark tokens as
# secrets). Business config (tariffs, chats, loyalty, ...) comes either from a
# Coolify File Mount at /app/config.toml or from env overrides — see DEPLOY-COOLIFY.md.

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # --- secrets + infrastructure (set in Coolify -> Environment Variables) ---
      BOT_TOKEN: "${BOT_TOKEN}"
      DATABASE_URL: "${DATABASE_URL}"          # postgresql+asyncpg://USER:PASS@HOST:5432/payment_bot
      REDIS_URL: "${REDIS_URL}"                # redis://HOST:6379/<db-index>
      ADMIN_IDS: "${ADMIN_IDS}"
      CRYPTOBOT_TOKEN: "${CRYPTOBOT_TOKEN}"
      XROCKET_TOKEN: "${XROCKET_TOKEN}"
      # --- required: the payment-events channel (flat alias for service_channel.chat_id) ---
      SERVICE_CHANNEL_ID: "${SERVICE_CHANNEL_ID}"
      # --- optional ---
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      # config.toml is supplied via a Coolify File Mount at this path; if absent,
      # built-in defaults apply and config must be set via *__ env overrides instead.
      CONFIG_PATH: "${CONFIG_PATH:-/app/config.toml}"
    # aiohttp server (health/metrics + provider webhooks like Tribute). Expose the port so
    # Traefik/Coolify targets 8080; set HTTP__HOST=0.0.0.0 in Coolify so it binds publicly.
    expose:
      - "8080"
    # Health is provided by the Dockerfile HEALTHCHECK (hits 127.0.0.1:8080/health).
