services:
  bot:
    build: .
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
    volumes:
      - payment_bot_logs:/app/logs
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
  payment_bot_logs:
