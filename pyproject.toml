[project]
name = "hydra-payment-bot"
version = "0.1.0"
description = "Hydra Monitors Telegram payment bot"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiogram>=3.28,<4.0",
    "aiogram-broadcast[ui]>=0.2,<0.3",
    "aiohttp>=3.14,<4.0",
    "apscheduler>=3.10,<4.0",
    "aiorocket2>=2.0.4,<3.0",
    "alembic>=1.18,<2.0",
    "asyncpg>=0.31,<1.0",
    "prometheus-client>=0.25,<1.0",
    "pydantic>=2.13,<3.0",
    "pydantic-settings>=2.14,<3.0",
    "python-json-logger>=4.1,<5.0",
    "redis>=7.4,<8.0",
    "sqlalchemy>=2.0,<3.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "ruff>=0.13,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
